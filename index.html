<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
</head>
<body>
  <p>If you are not redirected, <a id="destination-link">continue to the destination</a>.</p>
  <script>
    const destination = "https://<erweb-site>/index.html?config=https://github.com/mkhaymov/ErArts/blob/main/config.json";
    document.getElementById("destination-link").href = destination;
    window.location.replace(destination);
  </script>
</body>
</html>
