<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
</head>
<body>
  <p>If you are not redirected, <a id="destination-link">continue to the destination</a>.</p>
  <script>
    const destination = new URL("https://https://mkhaymov.github.io/ErWeb/index.html");
    const configUrl = new URL("./config.json", window.location.href);
    destination.searchParams.set("config", configUrl.href);
    const link = document.getElementById("destination-link");
    link.href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
